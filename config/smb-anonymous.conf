#=============================================================
# Samba 配置：匿名共享 /sdcard
# 适用：Termux on rooted Android
# 路径：$PREFIX/etc/samba/smb.conf
# 即：/data/data/com.termux/files/usr/etc/samba/smb.conf
#=============================================================

[global]
   workgroup = WORKGROUP
   server string = Android Samba (Termux)
   security = user
   map to guest = Bad User
   guest account = root
   server role = standalone
   bind interfaces only = no
   interfaces = 0.0.0.0/0

   # Termux 非 root 无法绑定 1024 以下端口
   # 实际监听 4445，通过 iptables 将 445 转发到 4445
   smb ports = 4445

   # 协议版本
   min protocol = SMB2
   max protocol = SMB3

   # 禁用 NetBIOS（减少开销）
   disable netbios = yes
   local master = no
   preferred master = no
   lm announce = no
   os level = 0

   # 允许所有主机访问
   hosts allow = all

   # 禁用打印
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   show add printer wizard = no

   # 日志
   enable core files = no
   max log size = 50
   log level = 0

   # ACL / 扩展属性（Android 不支持，关闭以提高性能）
   nt acl support = no
   unix extensions = no
   ea support = no
   store dos attributes = no
   map archive = no
   map hidden = no
   map readonly = no
   map system = no
   delete readonly = yes

   # 权限继承
   inherit permissions = yes

   # 性能优化
   use sendfile = yes
   socket options = TCP_NODELAY SO_KEEPALIVE
   oplocks = yes
   kernel oplocks = no
   strict locking = no

[sdcard]
   comment = Android Internal Storage
   path = /sdcard
   browseable = yes
   read only = no
   writable = yes
   guest ok = yes
   guest only = yes
   public = yes
   create mask = 0777
   directory mask = 0777
   force user = root
   force group = everybody
   vfs objects = aio_pthread
   aio_pthread:aio open = yes
